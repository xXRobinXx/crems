name: Publish Home Assistant image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exacte versie uit de twee CREMS addonmanifesten"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: version
        name: Validate release version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "version: \"$VERSION\"" crems/config.yaml
          grep -Fx "version: \"$VERSION\"" apps/home-assistant-addon/crems/config.yaml
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/home-assistant-addon/crems/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/xxrobinxx/crems-energy:${{ steps.version.outputs.value }}
            ghcr.io/xxrobinxx/crems-energy:latest
